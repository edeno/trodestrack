# Example YAML config for an NWB file.
#
# Run:
#   uv run trodestrack online --config examples/session_nwb.yaml
#   uv run trodestrack smooth --config examples/session_nwb.yaml
#
# Paths are resolved relative to this YAML file. Requires the [nwb]
# extra (``uv pip install 'trodestrack[nwb]'``). The loader auto-
# detects the position container by neurodata_type — Trodes-style
# ``Position`` (two SpatialSeries) and ndx-pose ``PoseEstimation``
# (per-bodypart series) are both supported.

inputs:
  format: nwb
  nwb:
    nwb_file: ../data/session.nwb
    # ``led_source`` is auto by default. Override to disambiguate
    # when the file has both Trodes and ndx-pose containers, or
    # when the writer used non-default series / bodypart names.
    led_source:
      container: auto  # or trodes_position / ndx_pose
      # For trodes_position (a pair):
      # led1_series_name: led_0_series_0
      # led2_series_name: led_1_series_0
      # For ndx_pose (a pair):
      # led1_bodypart: led_green
      # led2_bodypart: led_red
      # likelihood_threshold: 0.6
    # Override the file-stored conversion (useful for post-hoc
    # re-calibration). Without this the file's ``conversion``
    # attribute is used; with ``unit="pixels"`` and
    # ``conversion=1.0`` (the sentinel for "no calibration baked
    # in"), ``camera.meters_per_pixel`` below applies.
    # meters_per_pixel_override: 0.0022
    # Optional: bridge NWB DIO TimeSeries onto the EKF/UKF event
    # channel. Requires a matching ``ttl_events`` block below.
    # dio_to_ttl:
    #   name_to_source_id:
    #     beam_1: 1
    #     zone_a: 2
  # Optional parquet IMU override. Without this, the loader uses
  # the NWB analog group when present (processing/analog/...);
  # otherwise ``filter.state_mode`` must be ``vision_only``.
  # imu_file: ../data/session_imu.parquet

camera:
  meters_per_pixel: 0.0022

filter:
  # NWB analog IMU is auto-detected when the file has it; flip
  # state_mode to a fused mode in that case.
  state_mode: vision_only

led_identity:
  mode: auto

outputs:
  output_dir: ../runs/session_nwb
  write_diagnostics: true
  run_safety_checks: true

# Uncomment to drive TTL events from NWB DIO TimeSeries:
# ttl_events:
#   beams:
#     - id: 1
#       emitter: [0.05, 0.10]
#       receiver: [0.15, 0.10]
#   zone_triggers:
#     - id: 2
#       center: [0.20, 0.20]
