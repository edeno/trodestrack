# Example YAML config that adds the optional TTL event channel
# (beam break, zone trigger, RFID reader) to a SpikeGadgets/Trodes session.
#
# Run:
#   uv run trodestrack online --config examples/session_with_ttl_events.yaml
#
# All paths are resolved relative to this YAML file. Replace the inputs and
# the events parquet with your own session files before running.
#
# The events parquet schema is::
#
#     columns: [time (s, float), source_id (int), edge ("rise" | "fall")]
#
# ``source_id`` must match one of the configured ``id`` values below
# (uniqueness across beams / zone_triggers / rfid_readers is enforced at
# load time). Each source's configured ``active_edge`` filters the
# parquet stream before constructing Kalman updates.

inputs:
  format: spikegadgets_trodes
  imu_file: ../data/arthur20220324_imu_info.parquet
  position_file: ../data/arthur20220324_position_info.parquet

camera:
  meters_per_pixel: 0.0022

imu:
  mode: 3d
  run_calibration: true

filter:
  state_mode: 2d_cam_6dof_imu_orientation
  enable_experimental_accel_translation: false
  use_gravity_orientation_update: true

led_identity:
  mode: auto

outputs:
  output_dir: ../runs/arthur_session_with_ttl_events

ttl_events:
  events_file: ../data/arthur20220324_ttl_events.parquet
  # Static pad width for per-frame compact-index arrays. Raise this if
  # the loader reports "more than max_events_per_frame TTL events".
  max_events_per_frame: 8

  beams:
    # IR beam-break across an arena corridor. ``sigma_perp_m`` is the
    # perpendicular noise (typically the IR-beam width). The along-beam
    # σ is computed from the segment length.
    - id: 1
      emitter: [0.10, 0.05]
      receiver: [0.10, 0.55]
      sigma_perp_m: 0.005
      # Most beam-break circuits go LOW when the rat crosses; default
      # is fall, override to rise for inverted wiring.
      active_edge: fall
      label: arm1_entry
    - id: 2
      emitter: [0.90, 0.05]
      receiver: [0.90, 0.55]
      sigma_perp_m: 0.005
      label: arm2_entry

  zone_triggers:
    # Nose poke / lever press / opto trigger / gate. Anchor at the
    # center; isotropic σ for the activation disc.
    - id: 10
      center: [0.20, 0.30]
      sigma_m: 0.02
      active_edge: rise
      label: feeder1_poke
    - id: 11
      center: [0.80, 0.30]
      sigma_m: 0.02
      label: feeder2_poke

  rfid_readers:
    # RFID tag detection. ``effective_radius_m`` is the detection range;
    # treated as √2·σ of an isotropic 2D Gaussian fit to a uniform disc.
    - id: 20
      center: [0.50, 0.10]
      effective_radius_m: 0.05
      label: hub_reader
