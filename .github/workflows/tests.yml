name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        # ``dlc`` and ``nwb`` extras are required: several DLC and
        # cross-format parity tests use ``pytest.importorskip("tables")``
        # / ``pytest.importorskip("pynwb")`` and would silently skip
        # without them, masking loader regressions.
        run: |
          uv sync --extra dev --extra dlc --extra nwb
        env:
          UV_PYTHON: python${{ matrix.python-version }}

      - name: Run ruff check
        run: |
          uv run ruff check .
        env:
          UV_PYTHON: python${{ matrix.python-version }}

      - name: Run ruff format check
        run: |
          uv run ruff format --check .
        env:
          UV_PYTHON: python${{ matrix.python-version }}

      - name: Run mypy
        run: |
          uv run mypy src/trodestrack
        continue-on-error: true  # Don't fail build on type errors (yet)
        env:
          UV_PYTHON: python${{ matrix.python-version }}

      - name: Run tests with coverage
        # Exclude wall-clock benchmark tests by default. Their throughput
        # / latency assertions are hardware-dependent and the tests
        # themselves take ~45-60s each; running them across the full
        # OS × Python matrix on every push/PR is both slow and flaky on
        # GitHub-hosted runners. They can be invoked explicitly with
        # ``uv run pytest -m "slow or benchmark"`` locally or in a
        # dedicated workflow.
        run: |
          uv run pytest -m "not slow and not benchmark" --cov=src/trodestrack --cov-report=xml --cov-report=term
        env:
          MPLBACKEND: Agg  # Use non-GUI backend for matplotlib
          UV_PYTHON: python${{ matrix.python-version }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
