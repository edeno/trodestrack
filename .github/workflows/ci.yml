name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Build package
        run: |
          uv build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    # Only publish to real PyPI for full (non-prerelease) GitHub releases
    # or for an explicit workflow_dispatch with a release_tag. The release
    # event sets github.event.release.prerelease to true for prereleases;
    # gating here keeps prereleases off pypi.org.
    if: |
      (github.event_name == 'release' && github.event.release.prerelease == false) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    environment:
      name: pypi
      url: https://pypi.org/p/trodestrack
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-testpypi:
    name: Publish to TestPyPI (for testing)
    needs: [build]
    runs-on: ubuntu-latest
    # TestPyPI is the destination for prerelease GitHub releases.
    if: github.event_name == 'release' && github.event.release.prerelease == true
    environment:
      name: testpypi
      url: https://test.pypi.org/p/trodestrack
    permissions:
      id-token: write

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
