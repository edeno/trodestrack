[project]
name = "trodestrack"
version = "0.1.0"
description = "Sensor-fused 2D rat tracking with JAX EKF/UKF for SpikeGadgets/Trodes"
readme = "README.md"
authors = [{ name = "Eric Denovellis", email = "eric.denovellis@ucsf.edu" }]
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax~=0.4.0",
    "jaxlib~=0.4.0",
    "numpy~=2.1.0",
    "scipy~=1.14.0",
    "chex~=0.1.0",
    "optax~=0.2.0",
    "pydantic~=2.9.0",
    "pyyaml~=6.0.0",
    "pandas~=2.2.0",
    "matplotlib~=3.9.0",
    "tqdm~=4.66.0",
    "opencv-python>=4.12.0.88",
    "python-pptx>=1.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
video = [
    "opencv-python>=4.12.0.88",
]

[project.scripts]
trodestrack = "trodestrack:main"

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=25.9.0",
    "hypothesis>=6.140.0",
    "mypy>=1.18.2",
    "pandas-stubs>=2.3.2.250827",
    "pre-commit>=4.3.0",
    "pyarrow>=21.0.0",
    "pytest>=8.4.2",
    "pytest-benchmark>=5.1.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.1",
    "types-pyyaml>=6.0.12.20250915",
]


[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py311"  # Match minimum required version from project.requires-python

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in argument defaults (common in Pydantic/JAX)
    "SIM102",  # Nested if statements (stylistic preference, not enforced)
]

[tool.ruff.lint.isort]
known-first-party = ["trodestrack"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = false  # Too noisy for JAX code
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = false
strict_optional = true

[[tool.mypy.overrides]]
module = "trodestrack.models.*"
# Models module: Incrementally increase strictness across milestones
# M0: Baseline (match global config) - establish guardrails without breaking existing code
# M1+: Enable checks as type hints are added during refactor
disallow_untyped_defs = false       # M1 TODO: Enable after type hints added
disallow_incomplete_defs = false    # M1 TODO: Enable after type hints added
check_untyped_defs = false          # M1 TODO: Enable after type hints added
disallow_untyped_decorators = false # Keep disabled (JAX decorators often untyped)

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks performance benchmark tests (deselect with '-m \"not benchmark\"')",
]
