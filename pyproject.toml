[project]
name = "trodestrack"
version = "0.3.0"
description = "Sensor-fused 2D rat tracking with JAX EKF/UKF for SpikeGadgets/Trodes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "numpy>=2.0.0",
    "scipy>=1.10.0",
    "chex>=0.1.0",
    "optax>=0.2.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.60.0",
]
authors = [{ name = "Eric Denovellis", email = "eric.denovellis@ucsf.edu" }]
keywords = [
    "neuroscience",
    "tracking",
    "kalman-filter",
    "imu",
    "sensor-fusion",
    "jax",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/edeno/trodestrack"
Repository = "https://github.com/edeno/trodestrack"
Issues = "https://github.com/edeno/trodestrack/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.5.0",
    "mypy>=1.8.0",
    "hypothesis>=6.90.0",
    "coverage>=7.4.0",
    "pandas-stubs>=2.0.0",
    "types-pyyaml>=6.0.0",
    "pyarrow>=15.0.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
    "mkdocs-section-index>=0.3.0",
    "mkdocs-jupyter>=0.25.0",
    "jupytext>=1.16.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "nbconvert>=7.0.0",
    "ipykernel>=6.0.0",
    "jupytext>=1.16.0",
]
video = ["opencv-python>=4.8.0", "python-pptx>=1.0.0"]

[project.scripts]
trodestrack = "trodestrack:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# The README (used as the PyPI long_description) references `examples/...`
# scripts, so they need to be present in the source archive that ships to
# PyPI. The wheel still only installs `src/trodestrack` — examples are
# scripts users run from a checkout, not importable modules.
exclude = [
    ".uv-cache/",
    ".uv_cache/",
    ".claude/",
    ".benchmarks/",
    ".venv/",
    "data/",
    "site/",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trodestrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks performance benchmark tests (deselect with '-m \"not benchmark\"')",
]

[tool.ruff]
line-length = 88
target-version = "py311"
# Do NOT set `fix = true` here. With autofix on by default, CI runs of
# `ruff check .` rewrite files in the runner workspace and exit 0 even
# when violations were present, making lint checks pass on dirty
# branches. Pre-commit and the documented local commands already pass
# `--fix` explicitly when they want autofix.
show-fixes = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modernize syntax)
    "B",   # flake8-bugbear (find bugs)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Function calls in argument defaults (common in Pydantic/JAX)
    "B028",   # No explicit stacklevel in warnings (can add if needed)
    "SIM102", # Nested if statements (sometimes clearer than combined)
    "RUF001", # Ambiguous unicode in strings (allow × σ math symbols)
    "RUF002", # Ambiguous unicode in docstrings (allow × and math symbols)
    "RUF003", # Ambiguous unicode in comments (allow × and math symbols)
    "RUF005", # Tuple concatenation vs unpacking (stylistic)
    "RUF022", # __all__ not sorted (prefer logical grouping)
    "C408",   # dict() vs literal (stylistic, dict() clearer for keyword args)
]

[tool.ruff.lint.per-file-ignores]
# Test files: Allow test-specific patterns
"tests/**/*.py" = [
    "S101",    # Allow assert in tests
    "PLR2004", # Allow magic values in tests
]

# Example notebooks and scripts: Allow imports in cells
"docs/**/*.py" = [
    "E402", # Module level import not at top of file (common in notebook cells)
    "B905", # Allow zip() without strict parameter (backward compatibility)
]

# Data scripts: Allow flexible patterns
"data/**/*.py" = [
    "E402", # Module level import not at top of file
]

# Package init files: Allow unused imports (re-exports)
"__init__.py" = [
    "F401", # Allow unused imports (re-exports)
]

[tool.ruff.lint.isort]
known-first-party = ["trodestrack"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__pycache__/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = false       # Too noisy for scientific code with numpy/jax
warn_unused_configs = true
disallow_untyped_defs = false # Allow untyped defs in science code
disallow_any_generics = false # Allow generic types without parameters
warn_redundant_casts = true
no_implicit_reexport = true
strict_equality = true
pretty = true
show_error_codes = true
ignore_missing_imports = true # Scientific libraries often lack stubs

[[tool.mypy.overrides]]
module = ["tests", "tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "docs.*"
ignore_errors = true

[dependency-groups]
dev = [
    "pypdf>=6.12.0",
]
